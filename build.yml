name: Build Mutarjimi APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Mutarjimi.apk

      # رابط تحميل ثابت وسهل: صفحة Releases
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: مترجمي v${{ github.run_number }}
          files: Mutarjimi.apk
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: Mutarjimi-APK
          path: Mutarjimi.apk
